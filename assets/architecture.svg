<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF5F4"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F4C6D"/>
      <stop offset="1" stop-color="#4A5F85"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF9F5"/>
      <stop offset="1" stop-color="#DDF0E9"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F1ECFB"/>
      <stop offset="1" stop-color="#E7E1FB"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#1D4D4F"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0D3A3B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="700" y="80" text-anchor="middle" font-size="56" font-weight="700" fill="#0A3D4A">REI</text>
    <text x="700" y="120" text-anchor="middle" font-size="26" font-weight="500" fill="#0F5B63">Renewable Energy Intelligence</text>
    <text x="700" y="154" text-anchor="middle" font-size="20" fill="#1E6471">From generation to retirement — secure, transparent, fraud-free.</text>

    <g transform="translate(70,200)">
      <rect x="0" y="0" width="200" height="120" rx="18" fill="#DFF3EE" stroke="#9AD4C5"/>
      <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0D4B59">1. Generation</text>
      <text x="100" y="70" text-anchor="middle" font-size="15" fill="#0F5B63">Renewable energy</text>
      <text x="100" y="90" text-anchor="middle" font-size="15" fill="#0F5B63">is generated and</text>
      <text x="100" y="108" text-anchor="middle" font-size="15" fill="#0F5B63">recorded.</text>
    </g>

    <g transform="translate(270,200)">
      <rect x="0" y="0" width="200" height="120" rx="18" fill="#D9F2FB" stroke="#8CC8E8"/>
      <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0D4B59">2. Issuance</text>
      <text x="100" y="70" text-anchor="middle" font-size="15" fill="#0F5B63">RECs are issued</text>
      <text x="100" y="90" text-anchor="middle" font-size="15" fill="#0F5B63">based on verified</text>
      <text x="100" y="108" text-anchor="middle" font-size="15" fill="#0F5B63">generation data.</text>
    </g>

    <g transform="translate(470,200)">
      <rect x="0" y="0" width="200" height="120" rx="18" fill="#EAE4FB" stroke="#BCAFE8"/>
      <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0D4B59">3. Transfer</text>
      <text x="100" y="70" text-anchor="middle" font-size="15" fill="#0F5B63">Certificates are</text>
      <text x="100" y="90" text-anchor="middle" font-size="15" fill="#0F5B63">traded and ownership</text>
      <text x="100" y="108" text-anchor="middle" font-size="15" fill="#0F5B63">is updated.</text>
    </g>

    <g transform="translate(670,200)">
      <rect x="0" y="0" width="200" height="120" rx="18" fill="#DFF5EC" stroke="#9ECFC2"/>
      <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0D4B59">4. Verification</text>
      <text x="100" y="70" text-anchor="middle" font-size="15" fill="#0F5B63">AI detects anomalies</text>
      <text x="100" y="90" text-anchor="middle" font-size="15" fill="#0F5B63">and calculates</text>
      <text x="100" y="108" text-anchor="middle" font-size="15" fill="#0F5B63">risk scores.</text>
    </g>

    <g transform="translate(870,200)">
      <rect x="0" y="0" width="200" height="120" rx="18" fill="#F8E7D5" stroke="#E0B988"/>
      <text x="100" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0D4B59">5. Retirement</text>
      <text x="100" y="70" text-anchor="middle" font-size="15" fill="#0F5B63">RECs are retired</text>
      <text x="100" y="90" text-anchor="middle" font-size="15" fill="#0F5B63">and finalised for</text>
      <text x="100" y="108" text-anchor="middle" font-size="15" fill="#0F5B63">compliance.</text>
    </g>

    <g stroke="#0F5B63" stroke-width="3" marker-end="url(#arrow)">
      <line x1="270" y1="260" x2="242" y2="260"/>
      <line x1="470" y1="260" x2="442" y2="260"/>
      <line x1="670" y1="260" x2="642" y2="260"/>
      <line x1="870" y1="260" x2="842" y2="260"/>
      <line x1="1070" y1="260" x2="1042" y2="260"/>
    </g>

    <g transform="translate(110,390)">
      <rect x="0" y="0" width="220" height="290" rx="24" fill="#F3F7FB" stroke="#B8C9D9"/>
      <text x="110" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0C3B4C">Data Sources</text>
      <g font-size="20" fill="#0F5B63">
        <text x="30" y="94">Generation Data</text>
        <text x="30" y="150">Issuance Records</text>
        <text x="30" y="206">Transfer Logs</text>
        <text x="30" y="262">Retirement Events</text>
      </g>
    </g>

    <g transform="translate(350,390)">
      <rect x="0" y="0" width="700" height="290" rx="32" fill="url(#platform)" filter="url(#shadow)"/>
      <text x="350" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">REI Platform</text>

      <g transform="translate(45,90)">
        <rect x="0" y="0" width="270" height="120" rx="20" fill="#EAE7FF"/>
        <text x="135" y="56" text-anchor="middle" font-size="24" font-weight="600" fill="#1D3154">AI Fraud Detection</text>
        <text x="135" y="88" text-anchor="middle" font-size="18" fill="#1D3154">(Explainable Scoring)</text>
      </g>

      <g transform="translate(340,90)">
        <rect x="0" y="0" width="270" height="120" rx="20" fill="#DDEEFF"/>
        <text x="135" y="56" text-anchor="middle" font-size="24" font-weight="600" fill="#1D3154">Blockchain Ledger</text>
        <text x="135" y="88" text-anchor="middle" font-size="18" fill="#1D3154">(Lifecycle Tracking)</text>
      </g>

      <g transform="translate(45,190)">
        <rect x="0" y="0" width="270" height="80" rx="18" fill="#EAF9F4"/>
        <text x="135" y="35" text-anchor="middle" font-size="22" font-weight="600" fill="#1D3154">Role-Based Access</text>
        <text x="135" y="62" text-anchor="middle" font-size="18" fill="#1D3154">(Enterprise Dashboard)</text>
      </g>

      <g transform="translate(340,190)">
        <rect x="0" y="0" width="270" height="80" rx="18" fill="#FEECC7"/>
        <text x="135" y="35" text-anchor="middle" font-size="22" font-weight="600" fill="#1D3154">Reports & Analytics</text>
        <text x="135" y="62" text-anchor="middle" font-size="18" fill="#1D3154">(Compliance &amp; Investigation)</text>
      </g>
    </g>

    <g transform="translate(1080,390)">
      <rect x="0" y="0" width="220" height="290" rx="24" fill="#F3F7FB" stroke="#B8C9D9"/>
      <text x="110" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0C3B4C">Outputs</text>
      <g font-size="20" fill="#0F5B63">
        <text x="30" y="96">Verified Certificates</text>
        <text x="30" y="152">Fraud Alerts</text>
        <text x="30" y="208">Audit Reports</text>
        <text x="30" y="264">Full Traceability</text>
      </g>
    </g>

    <g stroke="#0F5B63" stroke-width="3" marker-end="url(#arrow)">
      <line x1="330" y1="530" x2="350" y2="530"/>
      <line x1="1050" y1="530" x2="1080" y2="530"/>
    </g>

    <g transform="translate(260,740)">
      <rect x="0" y="0" width="880" height="150" rx="24" fill="#EAF7F8" stroke="#A2D2D8"/>
      <text x="440" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0C3B4C">Users &amp; Stakeholders</text>

      <g transform="translate(80,70)">
        <rect x="0" y="0" width="120" height="54" rx="12" fill="#DFF3EE"/>
        <text x="60" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#0F5B63">Regulator</text>
      </g>
      <g transform="translate(240,70)">
        <rect x="0" y="0" width="150" height="54" rx="12" fill="#DFF3EE"/>
        <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#0F5B63">Issuing Authority</text>
      </g>
      <g transform="translate(430,70)">
        <rect x="0" y="0" width="150" height="54" rx="12" fill="#DFF3EE"/>
        <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#0F5B63">Energy Producer</text>
      </g>
      <g transform="translate(620,70)">
        <rect x="0" y="0" width="140" height="54" rx="12" fill="#DFF3EE"/>
        <text x="70" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#0F5B63">Corporate Buyer</text>
      </g>
      <g transform="translate(800,70)">
        <rect x="0" y="0" width="110" height="54" rx="12" fill="#DFF3EE"/>
        <text x="55" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#0F5B63">Auditor</text>
      </g>
    </g>
  </g>
</svg>
